<div 
[style]="isAuth ? 'margin-top: 50px' : 'margin-top:0'"
style="margin-top: 50px; width: 100%;">
  <!--- Экран 1 --->
  <div  style="margin-top: 10px;">
    <!-- Единственный h1 главной. Стоит над поиском, потому что именно это
         пользователь и делает на этом экране, а поисковику нужен один явный
         заголовок страницы — до правки на главной не было ни одного. -->
    <h1 class="main-page__h1">Онлайн-запись к мастерам и в салоны красоты</h1>
    <app-main-menu  ></app-main-menu>
    <!--- Слайдер Start  --->
    <!-- ngSkipHydration: p-carousel считает numVisible из window.innerWidth, а на
         сервере window нет — PrimeNG рендерит с numVisible=1 (5 карточек + 2 клона
         при circular), браузер пересчитывает на 7-9 (5 + 14-18 клонов). Разное
         количество узлов = ошибка гидратации NG0500, после которой Angular рисует
         карусель заново, а неразобранная серверная разметка остаётся в DOM — на
         экране две карусели. Со skip серверная разметка выбрасывается целиком и
         карусель строится на клиенте один раз (в HTML для поисковиков она есть). -->
    <app-slider ngSkipHydration></app-slider>
    <a class="main-page__masters" routerLink="/landing" *ngIf="!isAuth">
      <span class="main-page__masters-kicker">Мастерам</span>
      <span class="main-page__masters-title">Принимайте записи 24/7 — бесплатно и без комиссий</span>
      <span class="main-page__masters-cta">Стать мастером</span>
    </a>
    <app-uaafter-register  ></app-uaafter-register>
  </div>
</div>
