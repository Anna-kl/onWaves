<section class="gallery" style="max-height: 1000px; overflow-y: auto;">
  
    <div class="cont-vert-end-start w100">
      <img src="/assets/img/ba-edit/ico_close_pc.png" (click)="close()">
    </div>
  <h2 class="gallery__title" style="justify-content: center; display: flex; margin-bottom: 15px;">Данные</h2>

  <div class="masonry">
    <figure class="masonry__item" *ngFor="let p of images">
      <img [src]="p.url" loading="lazy" (click)="showImage(p)">
      <!-- <figcaption *ngIf="p.caption">{{ p.caption }}</figcaption> -->
    </figure>
  </div>
</section>
