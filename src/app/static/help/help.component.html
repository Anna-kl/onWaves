
<div class="cont-horiz" style="background: #FAFAFC;  padding-bottom: 20px;" >
    <div class="cont-vert list1200">
        <!-- Cтраница -->
        <div class="cont-vert-start-start w100 left-right20" >
            <!-- Заголовок страницы  -->
            <div class="cont-horiz-start margin-top50 margin-bottom50">
                <div class="cont-horiz btn-back margin-right30" (click)="goToMainPage()"> 
                </div>
                <div >
                    <h1>Помощь</h1>
                </div>
            </div>
            <div class="container">

  <div class="hero">
    <h1>Центр помощи OnWaves</h1>
    <p>Ответы на вопросы о записи, общении и работе платформы</p>
    <!-- <div class="search">
      <input type="text" placeholder="🔍 Найти ответ...">
    </div> -->
  </div>

  <!-- <div class="toggle">
    <button class="active" onclick="switchTab('clients', this)">Для клиентов</button>

            <div class="cont-horiz padding-top40 padding-bottom40"
           style="max-width:100%;" >
            <div class=" cont-vert" [ngClass]="btnProfile ? 'btn-recommend1' : 'btn-recommend3'"
            (click)="setClient()" >Для клиентов</div>
            <div class="cont-vert" [ngClass]="!btnProfile ? 'btn-recommend1' : 'btn-recommend2'"
             (click)="setMaster()">Для мастеров</div>
          </div>

    </div>
        <div class="faq-section" *ngIf="btnProfile">
                  <app-faq-question
                        question="Как записаться на услугу?"
                        [content]="{
                            paragraphs: [
                            'Перейдите в профиль мастера',
                            'В правой колонке, в самом низу блока найдите и кликните по кнопке Записаться онлайн '
                            ],
                            list: [
                            'В левом блоке (нижнем) выберите услуги, на которые хотите записаться - вы можете выбрать сразу несколько услуг',
                            'После выбора услуг, в верхней части блока появится кнопка Перейти к оформлению',
                            'На следующей странице выберите день и удобный слот для записи, далее оставьте комментарий (при необъодимости и подтвердите запись)'
                            ],
                            images: [
                            { url: 'assets/img/help/record1.png', caption: 'Кликните для записи' },
                            { url: 'assets/img/help/record2.png', caption: 'Выбор услуг' }
                            ]
                        }"
            ></app-faq-question>
                              <app-faq-question
                        question="Как отменить запись?"
                        [content]="{
                            paragraphs: [
                            'Перейдите в раздел Мои записи',
                            'Далее перейдите в карточку услуши '
                            ],
                            list: [
                            'Раскройке карточку с услугой',
                            'Кликните по кнопке Отменить',
                          
                            ],
                            images: [
                            { url: 'assets/img/help/cancel1.png', caption: 'Кликните для записи' },
                            { url: 'assets/img/help/cancel.png', caption: 'Выбор услуг' }
                            ]
                        }"
            ></app-faq-question>

</div> 

        <div class="faq-section" *ngIf="!btnProfile">
                  <app-faq-question
                        question="Как добавить услугу?"
                        [content]="{
                            paragraphs: [
                            'Перейдите в свой профиль',
                            'В правой колонке, в самом низу блока найдите и кликните по кнопке Редактировать профиль'
                            ],
                            list: [
                            'Выберите пункт Услуги',
                            'Вы можете создать группу услуг, для этого кликните по кнопке Создать группу услуг - введите название группы',
                            'Для добавления услуги кликните по кнопке Добавить услугу, выберите тип услугу (по часовая или услуга с указанием длительности), в открывшемся меню выберите категории услуги и кликните по ней, далее заполните карточку услуги'
                            ],
                            images: [
                            { url: 'assets/img/help/service1.png', caption: 'Перейдите в свой профиль' },
                            { url: 'assets/img/help/service2.png', caption: 'Перейти в режим редактирования услуг' }
                            ]
                        }"
            ></app-faq-question>

               <app-faq-question
                        question="Как начать принимать заказы?"
                        [content]="{
                            paragraphs: [
                            'Создайте услуги',
                            'Далее перейдите в раздел График работы '
                            ],
                            list: [
                            'Кликните по картойке Создать график работы',
                            'Укажите время начала работы и его окончания, при необходимости добавьте перерыв',
                          'Выберите интервал между началом записей, например, вы хотите принимать клиентов только начиная с 8:15 и чтобы следующее окно для записи было в 9:15, тогда выберите интервал кратный 1 часу (60 минут)',
                          'Далее кликните по кнопке Применить к дням и выберите дни, когда хотите чтобы этот график действовал'
                            ],
                            images: [
                            { url: 'assets/img/help/schedule0.png', caption: 'Кликните для записи' },
                            { url: 'assets/img/help/schedule1.png', caption: 'Выбор услуг' }
                            ]
                        }"
            ></app-faq-question>
