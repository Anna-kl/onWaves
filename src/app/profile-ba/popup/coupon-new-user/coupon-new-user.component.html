<div class="overlay" *ngIf="isVisible" (click)="hide()"></div>

<div class="popup" *ngIf="isVisible" role="dialog" aria-modal="true" aria-labelledby="welcome-coupon-title">
  <button type="button" class="close-btn" aria-label="Закрыть" (click)="hide()">×</button>

  <!-- Баннер купона: кликабелен целиком, на нём и нарисована кнопка «Записаться на услугу» -->
  <button type="button" class="coupon-img-btn" (click)="pick()">
    <img class="coupon-img" src="/assets/img/onwaves/coupon.png"
         alt="Подарок новым клиентам: скидка при первой записи на услугу через Onwaves" />
  </button>

  <div class="popup__body">
    <h3 id="welcome-coupon-title">Скидка на первую запись через Onwaves</h3>
    <ul class="tiers">
      <li *ngFor="let tier of tiers">{{ tier.text }}</li>
    </ul>
    <p class="note">
      Одна скидка на первую запись у одного мастера.
    </p>
    <div class="actions">
      <button type="button" class="action-btn" (click)="pick()">Выбрать услугу</button>
      <button type="button" class="later-btn" (click)="hide()">Не сейчас</button>
    </div>
  </div>
</div>
