
<!-- Свободное время. Состояние ровно одно (status), взаимоисключающие ветки. -->
<div class="w100 free-time-table cont-horiz" *ngIf="status !== 'idle'">

  <div class="slot-state" *ngIf="status === 'loading'" aria-live="polite">
    Загружаем свободное время
  </div>

  <div class="slot-state slot-state--error" *ngIf="status === 'error'" role="alert">
    <span>Не удалось загрузить свободное время</span>
    <button type="button" class="slot-state__retry" (click)="retry()">Повторить</button>
  </div>

  <div class="w100 cont-horiz wrap slot-block" *ngIf="status === 'ready'"
       [ngClass]="{ 'slot-block--error': errorEmpty }">

    <div class="calendar_alert margin-top30 margin-bottom30 cont-horiz w100" *ngIf="duration > 0">
      Выберите время начала
    </div>
    <div [ngClass]="{'teg-white': !slot.isChoose, 'teg-green': slot.isChoose}" style="margin: 2px;"
         (click)="chooseInterval(slot)" *ngFor="let slot of slots">
      {{slot.start}}
    </div>
  </div>

  <div class="slot-state slot-state--empty" *ngIf="status === 'empty'" role="status">
    {{emptyMessage}}
  </div>

</div>

<div class="slot-block__error-text row" *ngIf="errorEmpty && status === 'ready'">
  Ничего не выбрано — выберите время, это важно
</div>
