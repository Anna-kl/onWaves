
<!-- Свободное время -->
 <div *ngIf="freeSlots$|async as freeSlots">
  <div class="w100 free-time-table cont-horiz" >
  
  <div class="w100  cont-horiz wrap slot-block"  *ngIf="freeSlots.length !== 0"   [ngClass]="{ 'slot-block--error': errorEmpty }">
                 
    <div class="calendar_alert margin-top30 margin-bottom30 cont-horiz w100" *ngIf="duration > 0">
      Выберите время начала
    </div>
    <div [ngClass]="{'teg-white': !slot.isChoose, 'teg-green': slot.isChoose}" style="margin: 2px;"
         (click)="chooseInterval(slot)" *ngFor="let slot of freeSlots">
      {{slot.start}}
    </div>
  </div>
  <div *ngIf="freeSlots.length === 0">
    <span style="color: #d46c54;"> Нет доступных слотов для записи</span>
  </div>

</div>
  <div class="slot-block__error-text row" *ngIf="errorEmpty&&freeSlots.length > 0">
              Ничего не выбрано — выберите время, это важно
            </div>
            
          </div>
