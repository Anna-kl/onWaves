<app-promotion-publications [masterId]="id" placement="coupon_popup" [popupAllowed]="showWelcomeModal" (choose)="onWelcomeChoose()" (closed)="onWelcomeModalClosed()"></app-promotion-publications>
<app-promotion-publications [masterId]="id" placement="services"></app-promotion-publications>
<app-coupon-new-user [promotionLegacy]="id" legacyType="welcome" *ngIf="showWelcomeModal && welcomeCampaign"
    [campaign]="welcomeCampaign" (choose)="onWelcomeChoose()" (closed)="onWelcomeModalClosed()"></app-coupon-new-user>
<app-albums-show [isEdit]=false [profileId]="id" [canBook]="canBook"></app-albums-show>
<div #servicesAnchor></div>
<app-accordion [isUpdate]="false" [canSetService]="false" [canBook]="canBook" [profileId]="id" (setServices)="setServices($event)">
</app-accordion>
<div class="cont-vert-start-center wrap margin-top30" *ngIf="profile" #mapAnchor>
    <div class="margin-bottom40">
        <h3>{{ isMobileWork ? 'Города работы' : 'Как нас найти' }}</h3>
        <span class="address-points" *ngIf="addressLines.length > 1; else oneAddress">
          <span *ngFor="let line of addressLines">{{ line }}</span>
        </span>
        <ng-template #oneAddress>
        <span *ngIf="hasAddress; else noAddress">{{ addressText }}</span>
        </ng-template>
        <ng-template #noAddress><span class="address-empty">Адрес не указан</span></ng-template>
    </div>
    <!--Карта start (ленивая: SDK и геокод грузятся при попадании во вьюпорт) -->
          <div class="column-right-footer" *ngIf="mapVisible && ((geoPoint$|async) || geoList.length)">
            <app-my-ycomponent [geo]="geoPoint$|async" [geoList]="geoList" [avatar]="profile.avatarUrl ?? null"></app-my-ycomponent>
        </div>
    <!--Карта END-->
</div>
<app-reviews-carusel [id]="id"></app-reviews-carusel>
