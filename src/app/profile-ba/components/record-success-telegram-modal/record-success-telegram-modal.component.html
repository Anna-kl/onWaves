<div class="telegram-success">
  <button type="button" class="telegram-success__close" (click)="close()" aria-label="Закрыть"></button>

  <div class="telegram-success__top">
    <img
      class="telegram-success__logo"
      src="/assets/img/pwa/logo96.jpg"
      width="96"
      height="96"
      alt="OnWaves" />
  </div>



  <h2 class="telegram-success__title">Запись создана!</h2>
  <p class="telegram-success__lead">
    Вы не подписаны на Telegram — важные уведомления о записи могут пройти мимо.
  </p>
  <p class="telegram-success__hint">
    Подключите канал, чтобы не пропустить напоминания и сообщения мастера.
  </p>

  <div class="telegram-success__celebrate">


    <!-- Карандаш «пишет» — декор справа от галочки -->
    <div class="telegram-success__scribe" aria-hidden="true">
      <svg class="telegram-success__scribe-svg" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- линии «текста» -->
        <path
          d="M8 24c12-6 28-4 40 2s20 18 8 28-36 8-44-6 8-32 32-28"
          stroke="rgba(255,255,255,0.85)"
          stroke-width="2.2"
          stroke-linecap="round"
          fill="none" />
        <path
          d="M16 48c18-4 32 2 38 10"
          stroke="rgba(255,255,255,0.55)"
          stroke-width="2"
          stroke-linecap="round"
          fill="none" />
        <path
          d="M20 64c14 6 30 4 42-4"
          stroke="rgba(255,255,255,0.4)"
          stroke-width="1.8"
          stroke-linecap="round"
          fill="none" />
        <!-- карандаш -->
        <g transform="translate(52 72) rotate(-42)">
          <rect x="-6" y="-58" width="12" height="72" rx="3" fill="#F4D03F" stroke="rgba(0,0,0,0.12)" stroke-width="1" />
          <polygon points="-6,-58 6,-58 0,-72" fill="#2C2C2C" />
          <rect x="-5" y="12" width="10" height="10" rx="2" fill="#E8B86D" />
          <rect x="-4" y="20" width="8" height="6" rx="1" fill="#11142D" opacity="0.85" />
        </g>
      </svg>
    </div>
  </div>

  <a
    *ngIf="telegramSubscribeHref"
    class="telegram-success__cta"
    [href]="telegramSubscribeHref"
    target="_blank"
    rel="noopener noreferrer"
    (click)="close()">
    <span class="telegram-success__cta-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M21.5 2.5L2.5 11.2c-1.1.5-1.1 2.1 0 2.6l4.8 1.8 1.9 6c.3 1 1.6 1 2 .1l2.8-5.7 5.1 3.7c.9.6 2.1-.1 2-1.2L21.5 2.5zm-3.2 3.1l-9.8 9.2-.1-5.5 12.5-7.6-2.6 4z" />
      </svg>
    </span>
    Перейти в Telegram и подписаться
  </a>

  <button type="button" class="telegram-success__secondary" (click)="close()">Понятно, продолжить</button>
</div>
