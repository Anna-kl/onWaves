<app-booking-success [details]="successDetails" [price]="priceSummary" (done)="close()">
  <a class="success-followup" *ngIf="telegramSubscribeHref" [href]="telegramSubscribeHref"
     target="_blank" rel="noopener noreferrer" (click)="close()">
    <span class="success-followup__icon" aria-hidden="true">↗</span>
    <span><b>Напоминания в Telegram</b><small>Подключите уведомления о записи</small></span>
    <span aria-hidden="true">→</span>
  </a>
</app-booking-success>
