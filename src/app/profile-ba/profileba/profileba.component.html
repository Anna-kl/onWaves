<!-- Профиль БА со стороны  через карточки -->
<main>

<!-- Карточки нет или она заблокирована. Раньше в этом случае рисовался пустой
     каркас профиля с кодом 200 — см. handleProfileNotFound в компоненте. -->
<div class="parent-grey-light" *ngIf="notFound">
    <div class="disp1 top170">
        <div class="cont-vert" style="padding: 60px 20px; text-align: center; width: 100%;">
            <h1>Страница не найдена</h1>
            <p class="margin-bottom30">
                Такой карточки нет — возможно, мастер удалил её или сменил адрес страницы.
            </p>
            <a routerLink="/" class="btn-green" style="display: inline-block; padding: 12px 24px; color: #fff;">
                На главную
            </a>
        </div>
    </div>
</div>

<!-- List start -->
<div class="parent-grey-light" *ngIf="!notFound">
    <div class="disp1 top170" >
        <div class="ba-profile-layout">
            <div class="ba-profile-layout__left">
              <app-column-baprofile [id]="id" [splitForPromo]="true"></app-column-baprofile>
            </div>
            <div class="ba-profile-layout__right ba122-right-column">
              <app-landing-section
                class="ba-profile-layout__promo"
                [profileId]="id"
                [landing]="landing"
                [landingState]="landingState"
                [workLocations]="workLocations"></app-landing-section>
              <div class="ba-profile-layout__main">
                <router-outlet></router-outlet>
              </div>
            </div>
        </div>
    </div> <!--disp1 END-->
</div> <!-- parent-grey-light END -->
<!-- List END -->

</main>
