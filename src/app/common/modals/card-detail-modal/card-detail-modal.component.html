<div class="cdm" role="presentation">
  <div class="cdm__media" role="region" aria-label="Фото или видео услуги">
    <img class="cdm__img"
         *ngIf="!card.isVideo && card.imageUrl"
         [src]="card.imageUrl"
         [alt]="card.name"
         loading="lazy">

    <app-video-player class="cdm__video"
                      *ngIf="card.isVideo && card.imageUrl"
                      [url]="card.imageUrl"
                      [poster]="card.thumbUrl ?? null"
                      [eager]="true">
    </app-video-player>

    <div class="cdm__placeholder" *ngIf="!card.imageUrl" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <path d="M7 42L21 22l10 13 7-9 14 16H7z" fill="#CBD5E1"/>
        <circle cx="38" cy="16" r="6" fill="#CBD5E1"/>
      </svg>
    </div>
  </div>

  <div class="cdm__info">
    <button class="cdm__close" type="button" (click)="close()" aria-label="Закрыть">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M14 4L4 14M4 4l10 10" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round"/>
      </svg>
    </button>

    <span class="cdm__promo">Продвигаю</span>

    <h2 class="cdm__title" *ngIf="card.name && !isUUID(card.name)">{{ card.name }}</h2>
    <h2 class="cdm__title" *ngIf="!card.name || isUUID(card.name)">Без названия</h2>

    <p class="cdm__desc" *ngIf="card.description">{{ card.description }}</p>

    <div class="cdm__loading" *ngIf="isLoading">
      <p-progressSpinner [style]="{'width':'32px','height':'32px'}"></p-progressSpinner>
    </div>

    <section class="cdm__services" *ngIf="!isLoading && linkedServices.length > 0" aria-label="Похожие услуги">
      <h3 class="cdm__services-title">Похожие услуги</h3>
      <ul class="cdm__svc-list" role="listbox">
        <li class="cdm__svc-item"
            [class.cdm__svc-item--selected]="selectedIndex === i"
            *ngFor="let svc of linkedServices; let i = index"
            (click)="selectService(i)"
            (keydown.enter)="selectService(i)"
            (keydown.space)="selectService(i)"
            role="option"
            [attr.aria-selected]="selectedIndex === i"
            [tabindex]="0"
            [attr.aria-label]="svc.name + ' - ' + formatDuration(svc.duration) + ' ' + formatPrice(svc.price)">

          <div class="cdm__svc-thumb" aria-hidden="true">
            <img *ngIf="svc.images?.[0]?.url"
                 [src]="svc.images![0].url"
                 [alt]="svc.name"
                 loading="lazy">
            <span class="cdm__svc-initial" *ngIf="!svc.images?.[0]?.url">
              {{ svc.name.charAt(0) }}
            </span>
          </div>

          <div class="cdm__svc-body">
            <span class="cdm__svc-name">{{ svc.name }}</span>
            <span class="cdm__svc-meta" aria-hidden="true">
              <ng-container *ngIf="svc.duration">{{ formatDuration(svc.duration) }}&nbsp;&bull;&nbsp;</ng-container>
              <ng-container *ngIf="svc.price">{{ formatPrice(svc.price) }}</ng-container>
            </span>
          </div>

          <div class="cdm__svc-check" aria-hidden="true">
            <svg *ngIf="selectedIndex === i" width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 6.5L5.2 10L11 3.5" stroke="white" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </li>
      </ul>
    </section>

    <button class="cdm__book"
            type="button"
            [disabled]="selectedIndex < 0"
            [class.cdm__book--disabled]="selectedIndex < 0"
            aria-label="Записаться на услугу">Записаться</button>
  </div>
</div>
