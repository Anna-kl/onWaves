<div #hostEl
     class="ow-video"
     [class.ow-video--compact]="compact"
     [class.ow-video--expandable]="expandable"
     [class.ow-video--static]="!interactive"
     [class.is-loading]="state === 'loading'"
     [class.is-playing]="state === 'playing'"
     [class.is-ready]="state === 'ready'"
     [class.is-error]="state === 'error'">

  <video #videoEl
         playsinline
         preload="none"
         [attr.poster]="visiblePoster">
  </video>

  <button class="ow-cover"
          type="button"
          [attr.aria-label]="playLabel"
          (click)="onPlayClick($event)">
    <span class="ow-ring r1" aria-hidden="true"></span>
    <span class="ow-ring r2" aria-hidden="true"></span>
    <span class="ow-ring r3" aria-hidden="true"></span>

    <span class="ow-play" aria-hidden="true">
      <span class="ow-pulse"></span>
      <span class="ow-tri"></span>
    </span>

    <span class="ow-spin" aria-hidden="true"></span>
    <span class="ow-loading">{{ loadingLabel }}</span>
    <span class="ow-progress" aria-hidden="true">
      <i [class.is-indeterminate]="loadedPercent === null"
         [style.width.%]="loadedPercent ?? 40"></i>
    </span>
    <span class="ow-error">Видео недоступно — повторить</span>
    <span class="ow-logo" aria-hidden="true">Onwaves<i>.Online</i></span>
  </button>
</div>
