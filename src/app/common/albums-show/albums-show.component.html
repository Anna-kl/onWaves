<section class="portfolio" *ngIf="albums.length > 0">

  <div class="portfolio__header">
    <h2 class="portfolio__title">Портфолио мастера</h2>
    <button type="button" class="portfolio__see-all" *ngIf="hasMore || showAll" (click)="seeAll()">
      {{ showAll ? 'Свернуть' : 'Смотреть все работы' }}
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="portfolio__tabs" role="tablist">
    <button class="portfolio__tab"
            type="button"
            [class.portfolio__tab--active]="selectedAlbumId === null"
            (click)="selectTab(null)"
            role="tab">
      Все
    </button>
    <button class="portfolio__tab"
            type="button"
            *ngFor="let album of albums"
            [class.portfolio__tab--active]="selectedAlbumId === album.id"
            (click)="selectTab(album.id)"
            role="tab">
      {{ album.name }}
    </button>
  </div>

  <div class="portfolio__grid" *ngIf="!isLoading">
    <article class="portfolio__card" *ngFor="let card of visibleCards"
             (click)="openCard(card)" tabindex="0"
             (keydown.enter)="openCard(card)">

      <img class="portfolio__img"
           [src]="cardThumb(card)"
           [alt]="card.caption || ''"
           loading="lazy"
           (error)="onImgError($event)">

      <span class="portfolio__play" *ngIf="card.isVideo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="44" height="44" fill="none">
          <circle cx="24" cy="24" r="22" fill="rgba(13,148,160,.92)"/>
          <path d="M20 16.5v15l12-7.5-12-7.5Z" fill="#fff"/>
        </svg>
      </span>

      <div class="portfolio__overlay" *ngIf="card.caption">
        <span class="portfolio__card-desc">{{ card.caption }}</span>
      </div>
    </article>
  </div>

  <div class="portfolio__grid" *ngIf="isLoading">
    <div class="portfolio__skeleton" *ngFor="let i of [1,2,3,4]"></div>
  </div>

</section>
