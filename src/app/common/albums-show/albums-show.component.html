<section class="portfolio" *ngIf="albums.length > 0">

  <!-- ── Шапка секции ── -->
  <div class="portfolio__header">
    <h2 class="portfolio__title">Портфолио мастера</h2>
    <!-- <button class="portfolio__see-all" (click)="seeAll()">
      Смотреть все
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button> -->
  </div>

  <!-- ── Табы альбомов ── -->
  <div class="portfolio__tabs" role="tablist">
    <button class="portfolio__tab"
            [class.portfolio__tab--active]="selectedAlbumId === null"
            (click)="selectTab(null)"
            role="tab">
      Все
    </button>
    <button class="portfolio__tab"
            *ngFor="let album of albums"
            [class.portfolio__tab--active]="selectedAlbumId === album.id"
            (click)="selectTab(album.id)"
            role="tab">
      {{ album.name }}
    </button>
  </div>

  <!-- ── Сетка карточек ── -->
  <div class="portfolio__grid" *ngIf="!isLoading">
    <article class="portfolio__card" *ngFor="let card of displayCards"
             (click)="openCard(card)" tabindex="0"
             (keydown.enter)="openCard(card)">

      <!-- Изображение -->
      <img class="portfolio__img" [src]="card.previewUrl || card.imageUrl" [alt]="card.name"
           *ngIf="card.imageUrl && !card.isVideo" loading="lazy"
           (error)="onImgError($event)">

      <!-- Видео — плеер с анимацией Onwaves -->
      <app-video-player *ngIf="card.isVideo"
                        [url]="card.imageUrl!"
                        [poster]="card.thumbUrl ?? null"
                        [compact]="true"
                        [warmup]="!card.thumbUrl">
      </app-video-player>

      <!-- Плейсхолдер без обложки -->
      <div class="portfolio__placeholder" *ngIf="!card.imageUrl && !card.isVideo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path d="M5 30L13 18l6 8 5-6 11 10H5z" fill="#CBD5E1"/>
          <circle cx="27" cy="13" r="4" fill="#CBD5E1"/>
        </svg>
      </div>

      <!-- Бейдж услуги — верхний левый угол -->
      <span class="portfolio__svc-badge"
            *ngIf="getFirstServiceName(card.serviceIds) as svcName">
        {{ svcName }}
      </span>

      <!-- Нижний оверлей — описание -->
      <div class="portfolio__overlay" *ngIf="card.description || card.name">
        <span class="portfolio__card-desc">{{ card.description || card.name }}</span>
      </div>
    </article>
  </div>

  <!-- ── Скелетон загрузки ── -->
  <div class="portfolio__grid" *ngIf="isLoading">
    <div class="portfolio__skeleton" *ngFor="let i of [1,2,3,4]"></div>
  </div>

</section>
